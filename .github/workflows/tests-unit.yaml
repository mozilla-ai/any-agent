name: Unit Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
  # any-agent is in soft deprecation, so pushes are rare and dependency drift in
  # unpinned ranges can break the package for weeks without anyone noticing.
  # uv.lock is gitignored, so every run resolves dependencies from scratch; the
  # weekly schedule is what makes that resolution happen without a push.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  run-unit-tests:
    timeout-minutes: 30

    # Dependabot branches and forks do not receive repository secrets, so this is
    # empty there and the Codecov upload is skipped rather than failing the job.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - run: |
          uv sync -U --group tests --extra all --extra a2a

      - run: pytest tests/unit -v --cov --cov-report=xml

      - name: Upload coverage reports to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v6
        with:
          token: ${{ env.CODECOV_TOKEN }}
